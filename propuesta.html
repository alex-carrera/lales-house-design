r puerta principal&lt;/label&gt;&lt;div class=&quot;palette-caption&quot;&gt;&lt;span data-palette-caption aria-live=&quot;polite&quot;&gt;&lt;/span&gt;&lt;span class=&quot;palette-chips&quot; hidden&gt;&lt;i data-base-chip&gt;&lt;/i&gt;&lt;i data-accent-chip&gt;&lt;/i&gt;&lt;i data-roof-chip&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;canvas role=&quot;img&quot; aria-label=&quot;Propuesta representativa: gradas de giro redondo con peldaños compensados, sin descanso rectangular; salida al piso despejada. Sofá en L desplazado otros 30 centímetros hacia el fondo, sillón pequeño alineado y unido al sofá largo junto al ventanal, sin separación, mirando a la TV y mesa de centro retrasada 75 centímetros. Patio con cubierta única a igual altura y pendiente sobre moto, baño, bodega y asadero; moto longitudinal al muro, dos jardines y celosía retirados, suelo adoquinado y centro abierto, con mesón continuo de apoyo en lugar de la cocina de leña lateral. Minibar en L con mininevera junto al baño, botellero lateral, lavavasos a la derecha y dos maceteros bajo las gradas. Sillón pequeño retrasado otros 5 centímetros, con 45 centímetros acumulados, y reclinable adelantado 40 centímetros sobre su diagonal. Ambos conservan los 45 grados hacia la TV; reclinable representado cerrado. La hoja abierta de cocina estrecha el paso desde la entrada; escritorio junto a la ventana de calle prolongado hasta el muro frontal, de unos 165 por 60 centímetros. Lavaplatos de cocina desplazado otros 20 centímetros a la derecha, con 45 centímetros acumulados; grifo, hueco del mesón y mueble inferior ajustados. Ventanas de ambos baños hacia calle centradas en sus paredes y alineadas; la inferior crece a 1,50 por 0,75 metros, con vidrio de privacidad. Ventanales de fachada centrados en sus paños y jardinera baja bajo ventana de sala, junto a la entrada. Armario alto frente a cama con TV de 55 pulgadas centrada, guardado lateral, inferior y superior; llegada de gradas libre. Comedor y equipamiento de baños conservados. Paredes interiores en grises cálidos de la referencia; cocina con muebles gris piedra y grafito, mesón claro y salpicadero oscuro; baños en gris y madera, espejos redondos y porcelanato beige. Casa, baño del asadero y bodega con única combinación Tony Taupe, Restful White y Cloak Gray. Asadero y baño con porcelanato beige; bodega con adoquín y ventana del baño ampliada. Medidas reales y cálculo estructural pendientes.&quot;&gt;Exterior aproximado de la casa, cocina, baño y terraza.&lt;/canvas&gt;

  &lt;div class=&quot;sr-only&quot; aria-live=&quot;polite&quot; data-status&gt;&lt;/div&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }

    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }

    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );

      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

    }

      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }

    globalThis.addEventListener("pagehide", persistSize);
  }

    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;

        id: data.id,
        ok,

      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0

        return;

        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {

            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),

            pendingSize = size;

        }

        anchor.rel = "noopener noreferrer";

      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

  if (srcdoc == null) {

  }

    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {

    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000

      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }

  delete frame.dataset.srcdoc;
})();
