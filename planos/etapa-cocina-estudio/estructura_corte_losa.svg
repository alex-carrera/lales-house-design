<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624.0" role="img" aria-label="ENTREPISO · Dónde quedan acero, placa, malla y hormigón"><title>ENTREPISO · Dónde quedan acero, placa, malla y hormigón</title><desc>Metros. Modelo y propuesta de coordinación pendientes de comprobar en sitio. Frente abajo; fondo arriba. Utilizar cotas, no medir la pantalla.</desc><rect width="100%" height="100%" fill="#fffefb"/><text x="480" y="44.0" font-family="Arial,sans-serif" font-size="16.0" fill="#345a70" text-anchor="middle">ESTA ESTRUCTURA SOSTIENE EL ESTUDIO SOBRE LA COCINA · NO ES EL TECHO</text><polygon points="80,160.0 720,160.0 720,148.8 80,148.8" fill="#b89467" stroke="none" stroke-width="0"/><polygon points="80,232.0 720,232.0 720,184.0 80,184.0" fill="#deded6" stroke="none" stroke-width="0"/><polygon points="80,272.0 720,272.0 720,265.6 80,265.6" fill="#a3b2ba" stroke="none" stroke-width="0"/><polyline points="88.0,196.0 712.0,196.0" fill="none" stroke="#a44d37" stroke-width="2.0"/><polygon points="96.0,384.0 148.0,384.0 148.0,316.0 96.0,316.0" fill="#345a70" stroke="#345a70" stroke-width="1.2"/><polygon points="272.0,384.0 324.0,384.0 324.0,316.0 272.0,316.0" fill="#345a70" stroke="#345a70" stroke-width="1.2"/><polygon points="448.0,384.0 500.0,384.0 500.0,316.0 448.0,316.0" fill="#345a70" stroke="#345a70" stroke-width="1.2"/><polygon points="624.0,384.0 676.0,384.0 676.0,316.0 624.0,316.0" fill="#345a70" stroke="#345a70" stroke-width="1.2"/><text x="400.0" y="128.0" font-family="Arial,sans-serif" font-size="12.8" fill="#343c3b" text-anchor="middle">Piso terminado del estudio+2,65 m</text><text x="400.0" y="176.0" font-family="Arial,sans-serif" font-size="12.8" fill="#343c3b" text-anchor="middle">Hormigón:12 cm TOTALES contando el valle</text><text x="400.0" y="252.0" font-family="Arial,sans-serif" font-size="12.8" fill="#343c3b" text-anchor="middle">Placa colaborante acanalada (muestra esquemática)</text><text x="400.0" y="308.0" font-family="Arial,sans-serif" font-size="12.8" fill="#343c3b" text-anchor="middle">Vigas y viguetas metálicas · Perfiles por cálculo</text><text x="400.0" y="420.0" font-family="Arial,sans-serif" font-size="12.8" fill="#343c3b" text-anchor="middle">Gypsum cocina+2,20 m · Reserva total hasta piso alto 45 cm</text><polyline points="80,440.0 720,440.0" fill="none" stroke="#92988e" stroke-width="2.0"/><text x="400" y="492.0" font-family="Arial,sans-serif" font-size="13.600000000000001" fill="#345a70" text-anchor="middle">Placa → viguetas → vigas longitudinales → travesaños → seis columnas → bases</text><text x="400" y="548.0" font-family="Arial,sans-serif" font-size="12.8" fill="#a44d37" text-anchor="middle">Malla y concreto no sustituyen las vigas. No hay mampostería portante nueva sobre adobe.</text></svg>