ily="Arial,sans-serif" font-size="9" fill="#b47518">TD?</text></svg><text x="68.0" y="1018.0" font-family="Arial,sans-serif" font-size="14" fill="#343c3b">Rectángulo · equipo o etapa</text><text x="68.0" y="1040.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">Representa la red, la medición o el tablero. No indica su ubicación</text><text x="68.0" y="1056.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">física.</text><svg viewBox="0 0 32 32" role="img" aria-label="Línea con flecha · conexión" x="578.0" y="1004.0" width="38" height="38"><title>Línea con flecha · conexión</title><polyline points="2,16 29,16" fill="none" stroke="#b47518" stroke-width="1.8" /><polyline points="22,10 29,16 22,22" fill="none" stroke="#b47518" stroke-width="1.8" /></svg><text x="628.0" y="1018.0" font-family="Arial,sans-serif" font-size="14" fill="#343c3b">Línea con flecha · conexión</text><text x="628.0" y="1040.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">Indica la relación funcional y el sentido de lectura entre etapas.</text><svg viewBox="0 0 32 32" role="img" aria-label="Línea ramificada · distribución" x="18.0" y="1120.0" width="38" height="38"><title>Línea ramificada · distribución</title><polyline points="5,2 5,24 29,24" fill="none" stroke="#b47518" stroke-width="1.8" /><polyline points="5,10 26,10" fill="none" stroke="#b47518" stroke-width="1.8" /></svg><text x="68.0" y="1134.0" font-family="Arial,sans-serif" font-size="14" fill="#343c3b">Línea ramificada · distribución</text><text x="68.0" y="1156.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">Relaciona el tablero con los grupos de consumo propuestos.</text><svg viewBox="0 0 32 32" role="img" aria-label="C01-C12 · grupo eléctrico" x="578.0" y="1120.0" width="38" height="38"><title>C01-C12 · grupo eléctrico</title><text x="16" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b47518">C01</text></svg><text x="628.0" y="1134.0" font-family="Arial,sans-serif" font-size="14" fill="#343c3b">C01-C12 · grupo eléctrico</text><text x="628.0" y="1156.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">Identificador del grupo propuesto. El número no es amperaje ni cantidad de</text><text x="628.0" y="1172.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">cables.</text><svg viewBox="0 0 32 32" role="img" aria-label="TD? · tablero por localizar" x="18.0" y="1236.0" width="38" height="38"><title>TD? · tablero por localizar</title><rect x="1" y="6" width="30" height="20" fill="#ffffff" stroke="#b47518" stroke-width="1.8" /><text x="16" y="19" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#b47518">TD?</text></svg><text x="68.0" y="1250.0" font-family="Arial,sans-serif" font-size="14" fill="#343c3b">TD? · tablero por localizar</text><text x="68.0" y="1272.0" font-family="Arial,sans-serif" font-size="12" fill="#626962">TD significa tablero. El signo ? indica un dato pendiente de confirmar.</text></g></svg>